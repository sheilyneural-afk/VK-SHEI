version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    labels: ["dependencies", "area:repository"]
    groups:
      rust-patch-and-minor:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:47"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    labels: ["dependencies", "area:repository"]
