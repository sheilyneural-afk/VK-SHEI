name: GitHub device-flow helpers

on:
  pull_request:
    paths:
      - "tools/github-device-flow/**"
      - ".github/workflows/github-device-flow.yml"
  push:
    branches: [main]
    paths:
      - "tools/github-device-flow/**"
      - ".github/workflows/github-device-flow.yml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile tools/github-device-flow/device_login.py tools/github-device-flow/gh_token.py
