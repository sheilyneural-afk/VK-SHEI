name: Documentation truth

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "Cargo.toml"
      - "src/**"
      - "crates/**"
      - "docs/**"
      - "scripts/**"
      - "deploy/local-production/**"
      - "wiki/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "README.md"
      - "Cargo.toml"
      - "src/**"
      - "crates/**"
      - "docs/**"
      - "scripts/**"
      - "deploy/local-production/**"
      - "wiki/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run auditor regression tests
        run: python3 scripts/wiki_audit.py self-test
      - name: Clone published wiki
        run: git clone --depth 1 https://github.com/${{ github.repository }}.wiki.git "$RUNNER_TEMP/kv-shei-wiki"
      - name: Generate wiki proposal
        run: |
          python3 scripts/wiki_audit.py generate \
            --existing-wiki "$RUNNER_TEMP/kv-shei-wiki" \
            --output "$RUNNER_TEMP/generated-wiki"
      - name: Audit generated wiki
        run: |
          python3 scripts/wiki_audit.py check \
            --wiki "$RUNNER_TEMP/generated-wiki" \
            --receipt "$RUNNER_TEMP/wiki-audit-receipt.json"
      - name: Install Mermaid renderer
        run: npm install --global @mermaid-js/mermaid-cli@11.12.0
      - name: Render every Mermaid diagram
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/rendered-wiki"
          puppeteer_config="$RUNNER_TEMP/mermaid-puppeteer.json"
          mkdir -p "$output"
          printf '%s\n' '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' >"$puppeteer_config"
          for source in "$RUNNER_TEMP/generated-wiki"/*.md; do
            if grep -q '^```mermaid$' "$source"; then
              mmdc \
                --puppeteerConfigFile "$puppeteer_config" \
                --input "$source" \
                --output "$output/$(basename "$source")" \
                --quiet
            fi
          done
      - name: Record proposed changes
        shell: bash
        run: |
          set +e
          python3 scripts/wiki_audit.py diff \
            --existing-wiki "$RUNNER_TEMP/kv-shei-wiki" \
            --wiki "$RUNNER_TEMP/generated-wiki" \
            >"$RUNNER_TEMP/wiki-proposal.patch"
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-truth-${{ github.sha }}
          path: |
            ${{ runner.temp }}/generated-wiki
            ${{ runner.temp }}/rendered-wiki
            ${{ runner.temp }}/wiki-audit-receipt.json
            ${{ runner.temp }}/wiki-proposal.patch
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: audit
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: documentation-truth-${{ github.sha }}
          path: ${{ runner.temp }}/documentation-truth
      - name: Publish audited wiki after an approved main update
        env:
          WIKI_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git
        run: |
          scripts/wiki-publish.sh \
            --wiki "$RUNNER_TEMP/documentation-truth/generated-wiki" \
            --remote "$WIKI_REMOTE" \
            --confirm-publish
