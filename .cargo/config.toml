# Project-local build boundary.
# Build products and temporary files stay inside this repository tree.
# The directories below are created by scripts/check.sh and by CI;
# create them first (mkdir -p) when running cargo by hand.

[build]
target-dir = "deploy/local-production/runtime/build-target"
# sccache wraps the compiler: shared object cache across all builds.
# cargo-local.sh sets RUSTC_WRAPPER when sccache is available in the
# project's tool-bin; if it is not installed yet this key is harmless
# because the wrapper path is set via the environment, not here.
jobs = 2   # match nproc; avoids OOM on 4 GB machines with heavy crates

[net]
retry = 3
git-fetch-with-cli = true

[registries.crates-io]
protocol = "sparse"

# ── Profiles ──────────────────────────────────────────────────────────────────
# dev/test: incremental ON  → fast partial recompiles during development
# release:  incremental OFF → no intermediate .o clutter, smaller build-target
#           codegen-units=1 → full inlining, matches real production output

[profile.dev]
incremental = true

[profile.test]
incremental = true

[profile.release]
incremental = false
codegen-units = 1
strip = "none"          # keep symbols; verify-release.sh checks binary hashes

[profile.dev.package."*"]
opt-level = 0

[profile.test.package."*"]
opt-level = 0

# Heavy proc-macro and build-script crates: always compile optimised even in
# dev so they don't dominate incremental build times.
[profile.dev.package.syn]
opt-level = 3
[profile.dev.package.serde_derive]
opt-level = 3
[profile.dev.package.tokio-macros]
opt-level = 3
[profile.dev.package.thiserror-impl]
opt-level = 3

# ── Environment (project-scoped, never leaks to the system) ───────────────────
[env]
CARGO_TARGET_DIR = { value = "deploy/local-production/runtime/build-target", force = true, relative = true }
TMPDIR = { value = "deploy/local-production/runtime/tmp", force = true, relative = true }
TMP    = { value = "deploy/local-production/runtime/tmp", force = true, relative = true }
TEMP   = { value = "deploy/local-production/runtime/tmp", force = true, relative = true }
# Disable incremental for release explicitly via env (belt-and-suspenders)
CARGO_PROFILE_RELEASE_INCREMENTAL = { value = "false", force = true }
