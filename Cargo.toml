[package]
name = "mslim"
version = "0.4.0"
edition = "2024"
autobins = false

[workspace]
members = ["crates/mslim-adapter-api"]
resolver = "3"

[patch.crates-io]
# Security-maintained fork of tch 0.18.1. The immutable revision upgrades both
# tch and torch-sys from vulnerable zip 0.6.6 to zip 9.0.5.
tch = { git = "https://github.com/sheilyneural-afk/tch-rs.git", rev = "acaf9df5a07a3146da30ce74eebcf9aebd333692" }

[lib]
name = "mslim"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "mslim-long-context"
required-features = ["torch-backend"]
path = "src/bin/mslim-long-context.rs"

[[bin]]
name = "mslim-benchmark"
required-features = ["torch-backend"]
path = "src/bin/mslim-benchmark.rs"

[[bin]]
name = "mslim-chat"
required-features = ["torch-backend"]
path = "src/bin/mslim-chat.rs"

[[bin]]
name = "mslim-native-parity"
required-features = ["torch-backend"]
path = "src/bin/mslim-native-parity.rs"

[features]
# Native Rust functionality builds without PyTorch, LibTorch or a GPU.
default = ["native-cpu-backend"]
# Portable Rust CPU runtime. Model families are selected after config inspection.
native-cpu-backend = ["model-bundle"]
# LibTorch CPU runtime and its HTTP/CLI binaries.
torch-backend = ["dep:tch", "model-bundle", "http-server"]
# Native accelerator runtime and isolated attention reference. Concrete device
# libraries are implementation details selected behind the adapter boundary.
accelerator-backend = ["dep:opencl3", "model-bundle", "dep:minijinja", "http-server"]
model-bundle = ["dep:safetensors", "dep:tokenizers"]
# Physical adapter conformance is opt-in and never part of the portable suite.
physical-conformance = ["accelerator-backend"]
# HTTP-only Rust multiplexer; optional and does not load model weights.
unified-router = ["dep:reqwest", "http-server"]
# Release installer: opt-in because the core does not need network access.
release-installer = ["dep:reqwest"]
model-import = []
model-validation = ["model-bundle"]
model-catalog = ["dep:reqwest"]
# Native gfx1103 hipBLASLt BF16 matrix backend; only enabled explicitly.
hip-backend = ["accelerator-backend", "dep:libloading"]
# HTTP binaries are opt-in; the storage/configuration core does not need them.
http-server = ["dep:axum", "dep:tokio"]

[[bin]]
name = "mslim-inspect"
path = "src/bin/mslim-inspect.rs"

[[bin]]
name = "mslim-adapters"
path = "src/bin/mslim-adapters.rs"

[[bin]]
name = "mslim-autoconfigure"
path = "src/bin/mslim-autoconfigure.rs"

[[bin]]
name = "mslim-calibrate"
path = "src/bin/mslim-calibrate.rs"

[[bin]]
name = "mslim-certify"
path = "src/bin/mslim-certify.rs"

[[bin]]
name = "mslim-models"
path = "src/bin/mslim-models.rs"
required-features = ["model-bundle"]

[[bin]]
name = "mslim-import-model"
path = "src/bin/mslim-import-model.rs"
required-features = ["model-import"]

[[bin]]
name = "mslim-catalog"
path = "src/bin/mslim-catalog.rs"
required-features = ["model-catalog"]

[[bin]]
name = "mslim-recommend"
path = "src/bin/mslim-recommend.rs"
required-features = ["model-catalog"]

[[bin]]
name = "mslim-auth"
path = "src/bin/mslim-auth.rs"
required-features = ["model-catalog"]

[[bin]]
name = "mslim-download-model"
path = "src/bin/mslim-download-model.rs"
required-features = ["model-catalog"]

[[bin]]
name = "mslim-validate-model"
path = "src/bin/mslim-validate-model.rs"
required-features = ["model-bundle"]

[[bin]]
name = "mslim-attention-bench"
path = "src/bin/mslim-attention-bench.rs"
required-features = ["accelerator-backend"]

[[bin]]
name = "mslim-runtime-cli"
path = "src/bin/mslim-runtime-cli.rs"
required-features = ["accelerator-backend"]

[[bin]]
name = "mslim-runtime-compare"
path = "src/bin/mslim-runtime-compare.rs"
required-features = ["accelerator-backend", "torch-backend"]

[[bin]]
name = "mslim-adapter-parity"
path = "src/bin/mslim-adapter-parity.rs"
required-features = ["accelerator-backend", "native-cpu-backend"]

[[bin]]
name = "mslim-runtime-worker"
path = "src/bin/mslim-runtime-worker.rs"
required-features = ["accelerator-backend"]

[[bin]]
name = "mslim-runtime-host"
path = "src/bin/mslim-runtime-host.rs"

[[bin]]
name = "mslim-runtime-proxy"
path = "src/bin/mslim-runtime-proxy.rs"
required-features = ["http-server"]

[[bin]]
name = "mslim-runtime-provider"
path = "src/bin/mslim-runtime-provider.rs"
required-features = ["accelerator-backend"]

[[bin]]
name = "mslim-gateway"
path = "src/bin/mslim-gateway.rs"
required-features = ["unified-router"]

[[bin]]
name = "mslim-install-release"
path = "src/bin/mslim-install-release.rs"
required-features = ["release-installer"]

[[bin]]
name = "mslim-document-ask"
path = "src/bin/mslim-document-ask.rs"
required-features = ["torch-backend"]

[[bin]]
name = "mslim-document-gpu"
path = "src/bin/mslim-document-gpu.rs"
required-features = ["accelerator-backend"]

[[bin]]
name = "mslim-document"
path = "src/bin/mslim-document.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", optional = true }
half = { version = "2", features = ["bytemuck", "serde"] }
memmap2 = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
safetensors = { version = "0.3.3", optional = true }
tokenizers = { version = "0.22", optional = true }
minijinja = { version = "2", optional = true }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"], optional = true }
mslim-adapter-api = { path = "crates/mslim-adapter-api" }
tch = { version = "0.18", optional = true }
opencl3 = { version = "0.12.4", optional = true }
libloading = {version = "0.8.9", optional = true}
reqwest = { version = "0.12.28", optional = true, default-features = false, features = ["blocking", "json", "rustls-tls"] }
hex = "0.4"


[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
